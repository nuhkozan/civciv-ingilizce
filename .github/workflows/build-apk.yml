name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add permissions to manifest
        run: |
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Replace app icon
        shell: bash
        run: |
          declare -A sizes=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          for density in "${!sizes[@]}"; do
            size=${sizes[$density]}
            dir="android/app/src/main/res/mipmap-${density}"
            if [ -d "$dir" ]; then
              convert app-icon.png -resize ${size}x${size}\! "$dir/ic_launcher.png"
              convert app-icon.png -resize ${size}x${size}\! \( -size ${size}x${size} xc:none -fill white -draw "circle $((size/2)),$((size/2)) $((size/2)),1" \) -compose DstIn -composite "$dir/ic_launcher_round.png"
              if [ -f "$dir/ic_launcher_foreground.png" ]; then
                convert app-icon.png -resize ${size}x${size}\! "$dir/ic_launcher_foreground.png"
              fi
            fi
          done

      - name: Add splash screen
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/drawable-port-mdpi android/app/src/main/res/drawable-port-hdpi \
                   android/app/src/main/res/drawable-port-xhdpi android/app/src/main/res/drawable-port-xxhdpi \
                   android/app/src/main/res/drawable-port-xxxhdpi
          cp splash.png android/app/src/main/res/drawable/splash.png
          convert splash.png -resize 480x480 android/app/src/main/res/drawable-port-mdpi/splash.png
          convert splash.png -resize 800x800 android/app/src/main/res/drawable-port-hdpi/splash.png
          convert splash.png -resize 1280x1280 android/app/src/main/res/drawable-port-xhdpi/splash.png
          convert splash.png -resize 1600x1600 android/app/src/main/res/drawable-port-xxhdpi/splash.png
          convert splash.png -resize 1920x1920 android/app/src/main/res/drawable-port-xxxhdpi/splash.png

      - name: Set launch theme background
        shell: bash
        run: |
          STYLES=android/app/src/main/res/values/styles.xml
          if grep -q 'Theme.SplashScreen' "$STYLES" && ! grep -q 'windowSplashScreenBackground' "$STYLES"; then
            sed -i '/<style name="AppTheme.NoActionBarLaunch"/a\        <item name="windowSplashScreenBackground">#FFFDF7</item>' "$STYLES"
          fi
          if ! grep -q 'android:windowBackground' "$STYLES"; then
            sed -i '/<style name="AppTheme.NoActionBar"/a\        <item name="android:windowBackground">#FFFDF7</item>' "$STYLES"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: civciv-ingilizce-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
